services:
  homehold-db:
    image: postgres:16-alpine
    container_name: homehold-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - homehold_pgdata:/var/lib/postgresql/data
    # Not published to the host by default. Uncomment for local psql access:
    # ports:
    #   - "127.0.0.1:5433:5432"

  homehold-backend:
    build: ./backend
    container_name: homehold-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - homehold-db
    ports:
      - "127.0.0.1:3100:3100"

  homehold-frontend:
    build: ./frontend
    container_name: homehold-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4100:80"

volumes:
  homehold_pgdata:
