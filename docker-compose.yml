services:
  homehold-db:
    image: postgres:16-alpine
    container_name: homehold-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - homehold_pgdata:/var/lib/postgresql/data
    # Published to the host so local dev tooling (npm run dev / npm run
    # watch, outside Docker) can reach it directly for hot-reload dev. Not
    # needed by the deployed VPS stack (backend/frontend containers talk to
    # this over the Docker network regardless).
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10

  homehold-backend:
    build: ./backend
    container_name: homehold-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      homehold-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:6101:6101"

  homehold-frontend:
    build: ./frontend
    container_name: homehold-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:6100:80"

volumes:
  homehold_pgdata:
