# Self-hosted runner is registered and running on the VPS
# (actions.runner.lehenshtein-homehold.homehold.service). Deploys off `dev`,
# not `main` (mirrors eneri/eneri-be, which keep `main` untouched and
# deploy off develop/development). Push/merge into `dev` to trigger.
# Manual deploy: cd /root/homehold/homehold && git pull && docker compose up -d --build
name: Deploy Homehold

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /root/homehold/homehold

    steps:
      - name: Tag pre-deploy commit
        run: |
          CURRENT=$(git rev-parse HEAD)
          git tag -f "pre-deploy-$(date +%Y%m%d-%H%M%S)" $CURRENT

      - name: Pull latest code
        run: |
          git fetch origin dev
          git checkout dev
          git reset --hard origin/dev

      - name: Build and restart containers
        run: docker compose up -d --build

      - name: Health check
        run: |
          sleep 10
          curl -sf http://localhost:6101/ping || (docker compose logs --tail 30 && exit 1)
          curl -sf http://localhost:6100 || (docker compose logs --tail 30 && exit 1)

      - name: Clean up old images
        run: docker image prune -f

      - name: Notify success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHANNEL_ID }} \
            -d parse_mode=HTML \
            -d text="✅ <b>Homehold deployed</b>%0A${{ github.event.head_commit.message }}"

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHANNEL_ID }} \
            -d parse_mode=HTML \
            -d text="❌ <b>Homehold deploy failed</b>%0A${{ github.event.head_commit.message }}%0A%0ARollback:%0A<code>cd /root/homehold/homehold%0Agit tag -l \"pre-deploy-*\"%0Agit reset --hard TAG_NAME%0Adocker compose up -d --build</code>"
